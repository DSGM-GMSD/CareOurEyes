rs_atajos_texto = 在 Windows 任何地方都能用，即使視窗已關閉。點一下快捷鍵，再按下含 Ctrl、Alt 或 Win 的組合（或 F 鍵）。按 Esc 取消。
rs_atajo_pausar = 暫停或恢復濾鏡
rs_mis_reglas = 我的規則
rs_sin_reglas = 還沒有規則。
rs_regla_nueva = 新規則
rs_regla_nueva_texto = 輸入程式名稱（如 vlc.exe）、視窗類別或標題的一部分，然後選擇設定檔。
rs_usar_ventana = 使用「{0}」
rs_prisma_activo = Prisma 正在對一個視窗套用「{0}」。
rs_todas_pantallas = 所有顯示器
rs_todas_detalle = 所有顯示器同時使用相同設定
rs_n_pantallas = {0} 台顯示器
rs_arrancar_con_sistema = 隨系統啟動
rs_atajos_texto_x11 = 在桌面任何地方都能用，即使視窗已關閉。點一下快捷鍵，再按下含 Ctrl、Alt 或 Super 的組合（或 F 鍵）。按 Esc 取消。
rs_regla_nueva_texto_linux = 輸入程式名稱（如 vlc）、視窗類別或標題的一部分，然後選擇設定檔。
rs_solo_windows = 僅限 Windows
rs_atajos_texto_mac = 在系統任何地方都能用，即使視窗已關閉。點一下快捷鍵，再按下含 Ctrl、Option 或 Cmd 的組合（或 F 鍵）。按 Esc 取消。
rs_enfoque_no_disponible = 此處無法使用專注
rs_enfoque_no_disponible_texto = 條帶和遮罩需要有桌面特效（合成器）的 X11 工作階段，例如 Linux Mint Cinnamon。在 Wayland 上暫時無法顯示。
rs_prisma_solo_windows_texto = 稜鏡使用 Windows 放大鏡讓單一視窗變暗或變灰。Linux 和 macOS 沒有對應的功能。
rs_wayland_atajos = Wayland 下無法使用快捷鍵
rs_wayland_atajos_texto = Wayland 不允許應用程式監聽整個桌面的鍵盤。要使用全域快捷鍵，請使用 X11 工作階段。
rs_wayland_reglas = Wayland 下無法使用規則
rs_wayland_reglas_texto = Wayland 不允許應用程式得知哪個視窗是作用中，因此依程式的規則無法運作。要使用規則，請使用 X11 工作階段。
rs_brillo_no_disponible = 無法調整亮度
rs_brillo_no_disponible_texto = 此桌面只允許透過它自己的夜燈更改顏色。要降低亮度，請使用 X11 工作階段。
