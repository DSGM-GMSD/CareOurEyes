rs_tip_3 = 站起來伸展脖子和肩膀。
rs_tip_4 = 喝點水。
rs_estado_pausa = 計時已暫停
rs_estado_pausa_hasta = 已暫停 · {0} 後繼續
rs_posponer_n = +{0} 分鐘
