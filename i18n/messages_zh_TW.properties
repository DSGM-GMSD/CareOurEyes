rs_avisos_texto = 何時以及如何提醒你。
rs_aviso_previo_s = 提前提醒
rs_aviso_previo_texto = 休息前多久提醒（0 = 不提醒）。
rs_sonido = 提示音
rs_sonido_texto = 每次休息開始和結束時播放。
rs_posponer = 延後
rs_posponer_texto = 可在提醒中或休息期間延後（嚴格模式除外）。
rs_permitir_posponer = 允許延後
rs_veces_seguidas = 連續次數
rs_minutos_posponer = 分鐘
rs_automatico = 自動
rs_ausente = 離開電腦時暫停
rs_ausente_texto = 離開時間達到一次短休息時，回來後算作已休息。
rs_ausente_min = 無操作達
rs_estricta_nota = 嚴格休息：時間到自動結束。
