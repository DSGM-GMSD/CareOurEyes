rs_enfoque_no_disponible_texto = The band and the veil need an X11 session with desktop effects (a compositor), like Linux Mint Cinnamon. They cannot be shown on Wayland yet.
rs_prisma_solo_windows_texto = Prisma uses the Windows Magnifier to darken or gray out a single window. Linux and macOS have nothing equivalent.
rs_wayland_atajos = Shortcuts not available on Wayland
