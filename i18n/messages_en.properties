rs_wayland_reglas = Rules not available on Wayland
rs_wayland_reglas_texto = Wayland does not let an app know which window is active, so per-program rules cannot work. Use an X11 session to get them.
rs_brillo_no_disponible = Brightness not available
rs_brillo_no_disponible_texto = This desktop only lets the color change, through its own night light. To lower the brightness, use an X11 session.
