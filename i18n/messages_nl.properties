rs_atajos_texto = Ze werken overal in Windows, ook met het venster gesloten. Klik op een sneltoets en druk dan de combinatie met Ctrl, Alt of Win (of een F-toets). Esc annuleert.
rs_atajo_pausar = Filter pauzeren of hervatten
rs_mis_reglas = Mijn regels
rs_sin_reglas = Nog geen regels.
rs_regla_nueva = Nieuwe regel
rs_regla_nueva_texto = Typ het programma (bijv. vlc.exe), de vensterklasse of een deel van de titel en kies het profiel.
rs_usar_ventana = “{0}” gebruiken
rs_prisma_activo = Prisma past “{0}” toe op een venster.
rs_todas_pantallas = Alle schermen
rs_todas_detalle = Dezelfde instellingen op alle schermen tegelijk
rs_n_pantallas = {0} schermen
rs_arrancar_con_sistema = Starten met het systeem
rs_atajos_texto_x11 = Ze werken overal op het bureaublad, ook met het venster gesloten. Klik op een sneltoets en druk dan de combinatie met Ctrl, Alt of Super (of een F-toets). Esc annuleert.
rs_regla_nueva_texto_linux = Typ het programma (bijv. vlc), de vensterklasse of een deel van de titel en kies het profiel.
rs_solo_windows = Alleen op Windows
rs_atajos_texto_mac = Ze werken overal in het systeem, ook met het venster gesloten. Klik op een sneltoets en druk dan de combinatie met Ctrl, Option of Cmd (of een F-toets). Esc annuleert.
rs_enfoque_no_disponible = Focus is hier niet beschikbaar
rs_enfoque_no_disponible_texto = De band en de sluier hebben een X11-sessie met bureaubladeffecten (compositor) nodig, zoals Linux Mint Cinnamon. Onder Wayland kunnen ze nog niet worden getoond.
rs_prisma_solo_windows_texto = Prisma gebruikt het Windows-vergrootglas om één venster donkerder of grijs te maken. Linux en macOS hebben niets vergelijkbaars.
rs_wayland_atajos = Sneltoetsen niet beschikbaar onder Wayland
rs_wayland_atajos_texto = Wayland laat een app niet naar het toetsenbord van het hele bureaublad luisteren. Gebruik een X11-sessie voor globale sneltoetsen.
rs_wayland_reglas = Regels niet beschikbaar onder Wayland
rs_wayland_reglas_texto = Wayland laat een app niet weten welk venster actief is, dus regels per programma kunnen niet werken. Gebruik een X11-sessie om ze te hebben.
rs_brillo_no_disponible = Helderheid niet beschikbaar
rs_brillo_no_disponible_texto = Dit bureaublad laat alleen de kleur veranderen, met zijn eigen nachtlicht. Gebruik een X11-sessie om de helderheid te verlagen.
